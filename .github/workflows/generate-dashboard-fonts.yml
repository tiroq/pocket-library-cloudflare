name: Generate dashboard font atlases

# One-time source-to-raster generation for this feature branch. The generated
# glyph data is committed; normal Worker deploys do NOT download font files.
on:
  push:
    branches: [feat/dashboard-proportional-fonts]
    paths:
      - 'scripts/generate-dashboard-fonts.py'
      - '.github/workflows/generate-dashboard-fonts.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow==12.0.0'
      - name: Generate actual font bitmaps
        run: python scripts/generate-dashboard-fonts.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify font rendering and existing Worker routes
        run: npm test
      - name: Commit generated glyph atlases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/dashboard-font-atlases.js
          if ! git diff --cached --quiet; then
            git commit -m "build: bundle real Golos, Inter, Plex and Onest glyph atlases"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
